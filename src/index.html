<!DOCTYPE html>
<html lang="es" class="bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapas disponibles | Pydwarfs</title>
    <script src="tailwind.js"></script>
    <script type="module" src="selector.js"></script>
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top_right,_#26343a,_#020617_42rem)] font-sans">
    <main class="mx-auto min-h-screen w-full max-w-5xl px-6 py-16 sm:px-10">
        <p class="mb-3 text-xs font-bold uppercase tracking-[0.2em] text-emerald-300">Pydwarfs / mundo</p>
        <h1 class="text-4xl font-semibold tracking-tight text-slate-50 sm:text-6xl">Mapas disponibles</h1>
        <p id="map-status" class="mt-4 mb-10 text-slate-400" aria-live="polite">Cargando mapas...</p>
        <ul id="map-list" class="grid list-none grid-cols-[repeat(auto-fit,minmax(14rem,1fr))] gap-4 p-0" aria-live="polite"></ul>
    </main>
</body>
</html>
